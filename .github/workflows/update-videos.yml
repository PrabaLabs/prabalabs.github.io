name: Update videos from YouTube

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["video-notes.json", "tools/update_videos.py"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the channel feed
        run: python3 tools/update_videos.py
      - name: Publish if anything changed
        run: |
          if [ -n "$(git status --porcelain videos.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add videos.js
            git commit -m "Update videos from YouTube"
            git push
          fi
